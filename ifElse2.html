<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>If/Else Practice 2</title>
  <style>
    body { font-family: Arial; background: #eef2ff; text-align: center; margin: 0; padding: 6px; }
    .container { background: white; max-width: 860px; margin: auto; padding: 16px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2 { color: #333; font-size: 18px; margin: 6px 0; }
    h3 { font-size: 15px; margin: 6px 0; }
    button { padding: 7px 14px; margin: 4px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .levelBtn { background: #3f51b5; color: white; }
    .locked    { background: #bdbdbd; color: #444; }
    pre.code {
      background: #f4f4f4; padding: 10px 14px; border-radius: 8px;
      font-family: monospace; font-size: 13px; line-height: 1.5;
      text-align: left; display: block; margin: 8px auto;
      max-width: 680px; overflow-x: auto; white-space: pre;
      border-left: 4px solid #3f51b5;
    }
    .rules-box {
      background: #e8f5e9; border-left: 4px solid #4caf50;
      padding: 8px 14px; border-radius: 8px;
      font-family: monospace; font-size: 13px; line-height: 1.6;
      text-align: left; display: block; margin: 6px auto;
      max-width: 680px;
    }
    .vars-box {
      background: #fff8e1; border-left: 4px solid #ff9800;
      padding: 7px 14px; border-radius: 8px;
      font-family: monospace; font-size: 13px; line-height: 1.5;
      text-align: left; display: block; margin: 6px auto;
      max-width: 680px;
    }
    .q-label { font-size: 12px; color: #666; margin-bottom: 4px; }
    input[type="text"] {
      padding: 7px 10px; font-size: 14px; width: 200px;
      border: 2px solid #ccc; border-radius: 8px; margin: 6px;
      font-family: monospace;
    }
    input[type="text"]:focus { outline: none; border-color: #3f51b5; }
    #feedback { font-size: 15px; font-weight: bold; margin: 6px 0; min-height: 22px; }
    .tf-btn { font-size: 15px; padding: 10px 30px; border-radius: 8px; font-weight: bold; }
    .tf-true  { background: #4caf50; color: white; }
    .tf-false { background: #f44336; color: white; }
    .tf-true:hover  { background: #388e3c; }
    .tf-false:hover { background: #c62828; }
    #pinPanel { display: none; margin-top: 12px; background: #fff3cd; padding: 10px; border-radius: 8px; }
    .score-bar { font-size: 13px; color: #555; margin: 5px 0; }
    .next-btn { background: #3f51b5; color: white; font-size: 13px; padding: 7px 22px; border-radius: 8px; margin-top: 6px; }
    .back-btn { background: #9e9e9e; color: white; }
    .task-desc { font-size: 13px; color: #333; max-width: 640px; margin: 5px auto 8px; text-align: left; line-height: 1.5; }
    textarea.code-input {
      width: 90%; max-width: 640px; font-family: monospace; font-size: 13px;
      padding: 8px; border: 2px solid #ccc; border-radius: 8px;
      margin: 6px auto; display: block; resize: vertical; line-height: 1.5;
    }
    textarea.code-input:focus { outline: none; border-color: #3f51b5; }
    .test-results { text-align: left; display: inline-block; font-family: monospace;
                    font-size: 13px; margin-top: 8px; max-width: 640px; }
  </style>
</head>
<body>
<div class="container">

  <h2>If/Else Code Practice 2</h2>

  <div id="levelSelect">
    <h3>Select Level</h3>
    <button class="levelBtn" onclick="selectLevel(1)">Level 1 — Recall Mix</button><br>
    <button class="levelBtn locked" id="btn2" onclick="selectLevel(2)">Level 2 — Write: if/else</button><br>
    <button class="levelBtn locked" id="btn3" onclick="selectLevel(3)">Level 3 — Write: 3 Outcomes</button><br>
    <button class="levelBtn locked" id="btn4" onclick="selectLevel(4)">Level 4 — Write a Method</button><br>
    <button class="levelBtn locked" id="btn5" onclick="selectLevel(5)">Level 5 — Write Signature</button><br>
    <button class="levelBtn locked" id="btn6" onclick="selectLevel(6)">Level 6 — Write Full Method</button>
    <p style="color:#888;font-size:14px">Pass a level by scoring 30 correct answers (25 for Level 4), or ask your teacher for the PIN.</p>
    <div id="pinPanel">
      <p>Enter Teacher PIN to unlock:</p>
      <input id="pinInput" type="password" placeholder="PIN"
             onkeypress="if(event.key==='Enter')checkPin()" style="font-size:17px;width:100px;padding:8px;border-radius:6px;border:1px solid #ccc">
      <button onclick="checkPin()">Unlock</button>
    </div>
  </div>

  <div id="quiz" style="display:none">
    <h3 id="levelTitle"></h3>
    <div id="questionArea"></div>
    <div id="feedback"></div>
    <div class="score-bar">Correct: <span id="score">0</span> / <span id="passScore">30</span></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()" style="display:none">Next &#8594;</button>
    <br>
    <button class="back-btn" onclick="goBack()">&#8592; Back</button>
  </div>

</div>

<script>
// ── state ─────────────────────────────────────────────────────────────────────
let level = 1;
let score = 0;
let answered = false;
let qIdx = 0;
let requestedLevel = null;
let unlockedLevels = [true, false, false, false, false, false];

// ── navigation ────────────────────────────────────────────────────────────────
function selectLevel(l) {
  if (!unlockedLevels[l - 1]) {
    requestedLevel = l;
    document.getElementById("pinPanel").style.display = "block";
    return;
  }
  startQuiz(l);
}

function checkPin() {
  const pin = document.getElementById("pinInput").value;
  document.getElementById("pinInput").value = "";
  if (pin === "1502") {
    unlockedLevels[requestedLevel - 1] = true;
    const btn = document.getElementById("btn" + requestedLevel);
    btn.classList.remove("locked");
    btn.innerText = "Level " + requestedLevel + " — " + levelLabel(requestedLevel);
    document.getElementById("pinPanel").style.display = "none";
    startQuiz(requestedLevel);
  } else {
    alert("Wrong PIN");
  }
}

function levelLabel(l) {
  return ["Recall Mix","Write: if/else","Write: 3 Outcomes","Write a Method","Write Signature","Write Full Method"][l-1] || "";
}

function passScore() { return (level === 4 || level === 5) ? 25 : 30; }

function startQuiz(l) {
  level = l;
  score = 0;
  qIdx = 0;
  document.getElementById("score").innerText = 0;
  document.getElementById("passScore").innerText = (l === 4 || l === 5) ? 25 : 30;
  document.getElementById("quiz").style.display = "block";
  document.getElementById("levelSelect").style.display = "none";
  document.getElementById("levelTitle").innerText = "Level " + l + " — " + levelLabel(l);
  nextQuestion();
}

function goBack() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("levelSelect").style.display = "block";
}

function nextQuestion() {
  answered = false;
  document.getElementById("feedback").innerText = "";
  document.getElementById("nextBtn").style.display = "none";
  if (level === 1) showLevel1();
  else if (level === 2) showLevel2();
  else if (level === 3) showLevel3();
  else if (level === 4) showLevel4();
  else if (level === 5) showLevel5();
  else if (level === 6) showLevel6();
}

// ── helpers ───────────────────────────────────────────────────────────────────
function normalizeAnswer(s) {
  return String(s).trim().toLowerCase().replace(/^"+|"+$/g, "");
}

function onCorrect() {
  score++;
  document.getElementById("score").innerText = score;
  document.getElementById("feedback").style.color = "#4caf50";
  document.getElementById("feedback").innerText = "Correct!";
  document.getElementById("nextBtn").style.display = "inline-block";
  if (score >= passScore()) unlockNext();
}

function onWrong(correctVal) {
  document.getElementById("feedback").style.color = "#f44336";
  document.getElementById("feedback").innerText = `Wrong! Answer: "${correctVal}"`;
  document.getElementById("nextBtn").style.display = "inline-block";
}

function unlockNext() {
  if (level < 6) {
    unlockedLevels[level] = true;
    const btn = document.getElementById("btn" + (level + 1));
    if (btn) { btn.classList.remove("locked"); btn.innerText = "Level " + (level+1) + " — " + levelLabel(level+1); }
    document.getElementById("feedback").innerText += "  Level " + (level+1) + " unlocked!";
  } else {
    document.getElementById("feedback").innerText += "  You completed all levels!";
  }
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ══════════════════════════════════════════════════════════════════════════════
// LEVEL 1 — Recall Mix: T/F and text-return questions from old levels 1–5
// ══════════════════════════════════════════════════════════════════════════════
const L1_MIX = [
  // ── True / False ──────────────────────────────────────────────────────────
  { type:"tf", code:"int a = 5;\nint b = 3;\nif (a > b)",                                           ans: true  },
  { type:"tf", code:"boolean isDog = false;\nif (isDog)",                                           ans: false },
  { type:"tf", code:"boolean isRaining = true;\nif (!isRaining)",                                   ans: false },

  { type:"tf", code:"boolean a = false;\nboolean b = false;\nif (a || b)",                          ans: false },
  { type:"tf", code:"int x = 7;\nboolean isGood = true;\nif (x > 5 && isGood)",                    ans: true  },
  { type:"tf", code:"int x = 3;\nboolean isGood = true;\nif (x > 5 || isGood)",                    ans: true  },
  { type:"tf", code:"int a = 5;\nint b = 5;\nif (a >= b)",                                          ans: true  },
  { type:"tf", code:"int a = 4;\nint b = 5;\nif (a >= b)",                                          ans: false },
  { type:"tf", code:"int a = 5;\nint b = 3;\nif (a != b)",                                          ans: true  },
  { type:"tf", code:"boolean flag = false;\nif (flag || !flag)",                                    ans: true  },
  { type:"tf", code:"boolean flag = true;\nif (!flag && flag)",                                     ans: false },
  { type:"tf", code:"int x = 10;\nint y = 10;\nif (x == y && x > 0)",                              ans: true  },

  { type:"tf", code:"boolean a = true;\nboolean b = false;\nif (a || b)",                           ans: true  },

  // ── Simple if/else — type the return value ────────────────────────────────
  { type:"text", code:"boolean isDog = true;\nif (isDog) {\n  return \"Woofer\";\n} else {\n  return \"Meow\";\n}",                                                                           ans:"Woofer"     },

  { type:"text", code:"int weight = 3;\nif (weight < 5) {\n  return \"small\";\n} else {\n  return \"big\";\n}",                                                                             ans:"small"      },
  { type:"text", code:"boolean isOnSale = true;\nif (isOnSale) {\n  return \"50\";\n} else {\n  return \"100\";\n}",                                                                         ans:"50"         },
  { type:"text", code:"boolean isHappy = false;\nboolean isExcited = true;\nif (isHappy || isExcited) {\n  return \"smile\";\n} else {\n  return \"frown\";\n}",                              ans:"smile"      },

  { type:"text", code:"int score = 85;\nif (score >= 90) {\n  return \"A\";\n} else if (score >= 80) {\n  return \"B\";\n} else {\n  return \"C\";\n}",                                      ans:"B"          },
  { type:"text", code:"int score = 95;\nif (score >= 90) {\n  return \"A\";\n} else if (score >= 80) {\n  return \"B\";\n} else {\n  return \"C\";\n}",                                      ans:"A"          },
  { type:"text", code:"int temp = 5;\nif (temp > 30) {\n  return \"hot\";\n} else if (temp > 20) {\n  return \"warm\";\n} else if (temp > 10) {\n  return \"cool\";\n} else {\n  return \"cold\";\n}", ans:"cold" },
  { type:"text", code:"int temp = 25;\nif (temp > 30) {\n  return \"hot\";\n} else if (temp > 20) {\n  return \"warm\";\n} else if (temp > 10) {\n  return \"cool\";\n} else {\n  return \"cold\";\n}", ans:"warm" },
  { type:"text", code:"int age = 16;\nif (age < 3) {\n  return \"baby\";\n} else if (age < 13) {\n  return \"child\";\n} else if (age < 18) {\n  return \"teen\";\n} else {\n  return \"adult\";\n}", ans:"teen" },
  { type:"text", code:"int age = 8;\nif (age < 3) {\n  return \"baby\";\n} else if (age < 13) {\n  return \"child\";\n} else if (age < 18) {\n  return \"teen\";\n} else {\n  return \"adult\";\n}",  ans:"child" },
  { type:"text", code:"int weight = 35;\nif (weight < 5) {\n  return \"tiny\";\n} else if (weight < 20) {\n  return \"small\";\n} else if (weight < 50) {\n  return \"medium\";\n} else {\n  return \"large\";\n}", ans:"medium" },
  { type:"text", code:"int stars = 5;\nif (stars == 5) {\n  return \"excellent\";\n} else if (stars >= 4) {\n  return \"good\";\n} else if (stars >= 3) {\n  return \"ok\";\n} else {\n  return \"bad\";\n}", ans:"excellent" },
  { type:"text", code:"int stars = 3;\nif (stars == 5) {\n  return \"excellent\";\n} else if (stars >= 4) {\n  return \"good\";\n} else if (stars >= 3) {\n  return \"ok\";\n} else {\n  return \"bad\";\n}", ans:"ok" },
  { type:"text", code:"int speed = 80;\nif (speed > 130) {\n  return \"very fast\";\n} else if (speed > 100) {\n  return \"fast\";\n} else if (speed > 60) {\n  return \"normal\";\n} else {\n  return \"slow\";\n}", ans:"normal" },
  { type:"text", code:"String breed = \"husky\";\nif (breed.equals(\"labrador\")) {\n  return \"Nimbus\";\n} else if (breed.equals(\"husky\")) {\n  return \"Storm\";\n} else {\n  return \"Buddy\";\n}", ans:"Storm" },

  { type:"text", code:"boolean isBoy = true;\nString color = \"black\";\nif (!isBoy) {\n  return \"Piper\";\n} else if (color.equals(\"brown\")) {\n  return \"Nimbus\";\n} else {\n  return \"Hunter\";\n}", ans:"Hunter" },

  { type:"text", code:"String pet = \"dog\";\nboolean isHungry = false;\nboolean isSick = false;\nif (isSick) {\n  return \"go to vet\";\n} else if (pet.equals(\"dog\") && isHungry) {\n  return \"feed the dog\";\n} else if (pet.equals(\"cat\") && isHungry) {\n  return \"feed the cat\";\n} else {\n  return \"all good\";\n}", ans:"all good" },
  { type:"text", code:"int age = 20;\nint score = 55;\nif (age >= 18) {\n  if (score >= 90) {\n    return \"senior expert\";\n  } else if (score >= 70) {\n    return \"senior pass\";\n  } else {\n    return \"senior fail\";\n  }\n} else {\n  if (score >= 70) {\n    return \"junior pass\";\n  } else {\n    return \"junior fail\";\n  }\n}", ans:"senior fail" },
  { type:"text", code:"int age = 15;\nint score = 80;\nif (age >= 18) {\n  if (score >= 90) {\n    return \"senior expert\";\n  } else if (score >= 70) {\n    return \"senior pass\";\n  } else {\n    return \"senior fail\";\n  }\n} else {\n  if (score >= 70) {\n    return \"junior pass\";\n  } else {\n    return \"junior fail\";\n  }\n}", ans:"junior pass" },
];

let l1CurrentAns;
let l1CurrentType;

function showLevel1() {
  const q = L1_MIX[Math.floor(Math.random() * L1_MIX.length)];
  l1CurrentAns  = q.ans;
  l1CurrentType = q.type;

  if (q.type === "tf") {
    document.getElementById("questionArea").innerHTML = `
      <p class="q-label">What is the result of this condition?</p>
      <pre class="code">${escHtml(q.code)}</pre>
      <div>
        <button class="tf-btn tf-true"  onclick="checkLevel1(true)">True</button>
        <button class="tf-btn tf-false" onclick="checkLevel1(false)">False</button>
      </div>`;
  } else {
    document.getElementById("questionArea").innerHTML = `
      <p class="q-label">What value does this code return?</p>
      <pre class="code" id="l1code"></pre>
      <input type="text" id="ans1" placeholder='type answer...'
             onkeypress="if(event.key==='Enter')checkLevel1()">
      <button onclick="checkLevel1()">Check</button>`;
    document.getElementById("l1code").textContent = q.code;
    setTimeout(() => { const el = document.getElementById("ans1"); if (el) el.focus(); }, 50);
  }
}

function checkLevel1(val) {
  if (answered) return;
  if (l1CurrentType === "tf") {
    answered = true;
    if (val === l1CurrentAns) onCorrect();
    else onWrong(l1CurrentAns ? "True" : "False");
  } else {
    const input = document.getElementById("ans1").value;
    if (!input.trim()) return;
    answered = true;
    if (normalizeAnswer(input) === normalizeAnswer(l1CurrentAns)) onCorrect();
    else onWrong(l1CurrentAns);
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// LEVEL 2 — Write the code: 1 parameter, exactly 2 possible return values
// ══════════════════════════════════════════════════════════════════════════════
const L2_CHALLENGES = [
  {
    description: 'Return "pass" if score is 60 or above. Otherwise return "fail".',
    vars: [{name:"score",type:"int"}],
    tests: [
      {vals:{score:80}, expected:"pass"},
      {vals:{score:60}, expected:"pass"},
      {vals:{score:59}, expected:"fail"},
      {vals:{score:0},  expected:"fail"},
    ]
  },
  {
    description: 'Return "adult" if age is 18 or above. Otherwise return "minor".',
    vars: [{name:"age",type:"int"}],
    tests: [
      {vals:{age:18}, expected:"adult"},
      {vals:{age:25}, expected:"adult"},
      {vals:{age:17}, expected:"minor"},
      {vals:{age:5},  expected:"minor"},
    ]
  },
  {
    description: 'Return "big" if weight is more than 10. Otherwise return "small".',
    vars: [{name:"weight",type:"int"}],
    tests: [
      {vals:{weight:11},  expected:"big"  },
      {vals:{weight:100}, expected:"big"  },
      {vals:{weight:10},  expected:"small"},
      {vals:{weight:3},   expected:"small"},
    ]
  },
  {
    description: 'Return "hot" if temp is above 25. Otherwise return "cold".',
    vars: [{name:"temp",type:"int"}],
    tests: [
      {vals:{temp:30}, expected:"hot" },
      {vals:{temp:26}, expected:"hot" },
      {vals:{temp:25}, expected:"cold"},
      {vals:{temp:10}, expected:"cold"},
    ]
  },
  {
    description: 'Return "Woofer" if isDog is true. Otherwise return "Meow".',
    vars: [{name:"isDog",type:"boolean"}],
    tests: [
      {vals:{isDog:true},  expected:"Woofer"},
      {vals:{isDog:false}, expected:"Meow"  },
    ]
  },
  {
    description: 'Return "enter" if hasTicket is true. Otherwise return "stay home".',
    vars: [{name:"hasTicket",type:"boolean"}],
    tests: [
      {vals:{hasTicket:true},  expected:"enter"    },
      {vals:{hasTicket:false}, expected:"stay home"},
    ]
  },
  {
    description: 'Return "even" if n is divisible by 2. Otherwise return "odd".',
    vars: [{name:"n",type:"int"}],
    tests: [
      {vals:{n:4},  expected:"even"},
      {vals:{n:10}, expected:"even"},
      {vals:{n:7},  expected:"odd" },
      {vals:{n:1},  expected:"odd" },
    ]

// Shared helpers for write-the-code levels
// ══════════════════════════════════════════════════════════════════════════════
function fmtVal(v) {
  return typeof v === 'string' ? '"' + v + '"' : String(v);
}

function renderWriteChallenge(q, id, checkFn) {
  const varDecl  = q.vars.map(v => v.type + ' ' + v.name).join(',  ');
  const varNames = q.vars.map(v => v.name);
  const testLines = q.tests.map(t =>
    '(' + varNames.map(n => fmtVal(t.vals[n])).join(', ') + ')  ->  ' + fmtVal(t.expected)
  ).join('\n');

  document.getElementById("questionArea").innerHTML = `
    <p class="task-desc">${escHtml(q.description)}</p>
    <div class="vars-box" id="${id}vars"></div>
    <pre class="code" id="${id}tests"></pre>
    <textarea class="code-input" id="${id}code" rows="10"
      placeholder="Write your if/else code here...\n\nif (...) {\n  return ...;\n} else {\n  return ...;\n}"></textarea>
    <button onclick="${checkFn.name}()">Check</button>
    <div class="test-results" id="${id}results"></div>`;

  document.getElementById(id + "vars").textContent  = 'Variables:   ' + varDecl;
  document.getElementById(id + "tests").textContent = 'Test cases:\n' + testLines;
  setTimeout(() => { const el = document.getElementById(id + "code"); if (el) el.focus(); }, 50);
}

function runWriteCheck(id, q, onSolvedCallback, extractBody) {
  const input      = document.getElementById(id + "code").value.trim();
  const resultsDiv = document.getElementById(id + "results");
  if (!input) { resultsDiv.innerText = "Write some code first."; return; }

  const varNames = q.vars.map(v => v.name);
  let code = input.replace(/(\w+)\.equals\(([^)]+)\)/g, '$1 === $2');
  if (extractBody) {
    const firstBrace = code.indexOf('{');
    const lastBrace  = code.lastIndexOf('}');
    if (firstBrace === -1 || lastBrace === -1) {
      resultsDiv.innerText = 'Write the full method including { and }.';
      return;
    }
    code = code.substring(firstBrace + 1, lastBrace);
  }

  const passed = [], failed = [];
  try {
    for (let i = 0; i < q.tests.length; i++) {
      const t      = q.tests[i];
      const fn     = new Function(...varNames, code);
      const result = fn(...varNames.map(n => t.vals[n]));
      if (String(result) === String(t.expected)) passed.push(i);
      else failed.push(i);
    }

    let html = '';
    if (failed.length === 0) {
      html = '<div style="color:green;font-size:18px;font-weight:bold">All tests passed!</div><br>';
      onSolvedCallback(true);
      if (!answered) {
        answered = false; // keep false so onCorrect sets it
        onCorrect();
      }
    } else {
      html = '<div style="color:#c62828;font-weight:bold">' + failed.length + ' test(s) failing — fix your code and try again:</div><br>';
    }

    for (let i = 0; i < q.tests.length; i++) {
      const t       = q.tests[i];
      const valsStr = varNames.map(n => fmtVal(t.vals[n])).join(', ');
      if (failed.includes(i)) {
        let got = '?';
        try {
          const fn2 = new Function(...varNames, code);
          got = fmtVal(fn2(...varNames.map(n => t.vals[n])));
        } catch(e) { got = 'error'; }
        html += '<div style="color:red">  (' + valsStr + ')  ->  expected ' + fmtVal(t.expected) + ', got ' + got + '</div>';
      } else {
        html += '<div style="color:green">  (' + valsStr + ')  ->  ' + fmtVal(t.expected) + '</div>';
      }
    }
    resultsDiv.innerHTML = html;

  } catch(e) {
    resultsDiv.innerText = 'Error in your code: ' + e.message;
  }
}
