<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Increment & Variables Practice</title>
  <style>
    body { font-family: Arial; background: #eef2ff; text-align: center; margin: 0; padding: 6px; }
    .container { background: white; max-width: 860px; margin: auto; padding: 16px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2 { color: #333; font-size: 18px; margin: 6px 0; }
    h3 { font-size: 15px; margin: 6px 0; }
    button { padding: 7px 14px; margin: 4px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .levelBtn { background: #3f51b5; color: white; }
    .locked    { background: #bdbdbd; color: #444; }
    pre.code {
      background: #f4f4f4; padding: 10px 14px; border-radius: 8px;
      font-family: monospace; font-size: 13px; line-height: 1.5;
      text-align: left; display: block; margin: 8px auto;
      max-width: 680px; overflow-x: auto; white-space: pre;
      border-left: 4px solid #3f51b5;
    }
    .q-label { font-size: 12px; color: #666; margin-bottom: 4px; }
    input[type="text"] {
      padding: 7px 10px; font-size: 14px; width: 200px;
      border: 2px solid #ccc; border-radius: 8px; margin: 6px;
      font-family: monospace;
    }
    input[type="text"]:focus { outline: none; border-color: #3f51b5; }
    #feedback { font-size: 15px; font-weight: bold; margin: 6px 0; min-height: 22px; }
    .score-bar { font-size: 13px; color: #555; margin: 5px 0; }
    .next-btn { background: #3f51b5; color: white; font-size: 13px; padding: 7px 22px; border-radius: 8px; margin-top: 6px; }
    .back-btn { background: #9e9e9e; color: white; }
    #pinPanel { display: none; margin-top: 12px; background: #fff3cd; padding: 10px; border-radius: 8px; }
    #countdown {
      display: none; width: 52px; height: 52px;
      border-radius: 50%; margin: 8px auto; position: relative;
      cursor: pointer;
    }
    #countdown::after {
      content: ''; position: absolute;
      top: 6px; left: 6px; width: 40px; height: 40px;
      background: white; border-radius: 50%;
    }
    #countdown-text {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 17px; font-weight: bold; color: #3f51b5;
      z-index: 1;
    }
  </style>
</head>
<body>
<div class="container">

  <h2>Variables &amp; ++/-- Practice</h2>

  <div id="levelSelect">
    <h3>Select Level</h3>
    <button class="levelBtn" onclick="selectLevel(1)">Level 1 — Variables &amp; ++/--</button><br>
    <button class="levelBtn locked" id="btn2" onclick="selectLevel(2)">Level 2 — Method Trace</button><br>
    <button class="levelBtn locked" id="btn3" onclick="selectLevel(3)">Level 3 — Write ++/-- Method</button><br>
    <button class="levelBtn locked" id="btn4" onclick="selectLevel(4)">Level 4 — Write: If + ++/--</button>
    <p style="color:#888;font-size:14px">Pass level 1 with 40, level 2 with 30, level 3 with 20, level 4 with 15. Or ask your teacher for the PIN.</p>
    <div id="pinPanel">
      <p>Enter Teacher PIN to unlock:</p>
      <input id="pinInput" type="password" placeholder="PIN"
             onkeypress="if(event.key==='Enter')checkPin()" style="font-size:17px;width:100px;padding:8px;border-radius:6px;border:1px solid #ccc">
      <button onclick="checkPin()">Unlock</button>
    </div>
    <br>
    <a href="index.html"><button class="back-btn">&#8592; Main Menu</button></a>
  </div>

  <div id="quiz" style="display:none">
    <h3 id="levelTitle"></h3>
    <div id="questionArea"></div>
    <div id="feedback"></div>
    <div id="countdown" onclick="cancelCountdown()">
      <div id="countdown-text"></div>
    </div>
    <div class="score-bar">Correct: <span id="score">0</span> / <span id="passScore">40</span></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()" style="display:none">Next &#8594;</button>
    <br>
    <button class="back-btn" onclick="goBack()">&#8592; Back</button>
  </div>

</div>

<script>
// ── state ────────────────────────────────────────────────────────────────────
let level = 1;
let score = 0;
let answered = false;
let requestedLevel = null;
let unlockedLevels = [true, false, false, false];
let currentQ = null;
let countdownRaf = null;
let challengeIdx = 0;

// ── navigation ────────────────────────────────────────────────────────────────
function selectLevel(l) {
  if (!unlockedLevels[l - 1]) {
    requestedLevel = l;
    document.getElementById("pinPanel").style.display = "block";
    return;
  }
  startQuiz(l);
}

function checkPin() {
  const pin = document.getElementById("pinInput").value;
  document.getElementById("pinInput").value = "";
  if (pin === "1502") {
    unlockedLevels[requestedLevel - 1] = true;
    const btn = document.getElementById("btn" + requestedLevel);
    btn.classList.remove("locked");
    btn.innerText = "Level " + requestedLevel + " — " + levelLabel(requestedLevel);
    document.getElementById("pinPanel").style.display = "none";
    startQuiz(requestedLevel);
  } else {
    alert("Wrong PIN");
  }
}

function levelLabel(l) {
  return ["Variables & ++/--", "Method Trace", "Write: ++/-- Method", "Write: If + ++/--"][l - 1] || "";
}

function passScore() {
  if (level === 1) return 40;
  if (level === 2) return 30;
  if (level === 3) return 20;
  return 15;
}

function startQuiz(l) {
  level = l;
  score = 0;
  challengeIdx = 0;
  document.getElementById("score").innerText = 0;
  document.getElementById("passScore").innerText = passScore();
  document.getElementById("quiz").style.display = "block";
  document.getElementById("levelSelect").style.display = "none";
  document.getElementById("levelTitle").innerText = "Level " + l + " — " + levelLabel(l);
  nextQuestion();
}

function goBack() {
  cancelCountdown();
  document.getElementById("quiz").style.display = "none";
  document.getElementById("levelSelect").style.display = "block";
}

// ── question rendering ────────────────────────────────────────────────────────
function nextQuestion() {
  cancelCountdown();
  answered = false;
  document.getElementById("feedback").innerText = "";
  document.getElementById("nextBtn").style.display = "none";

  if (level === 1) {
    currentQ = generateL1();
    renderInputQ("What is the value of the variable?");
  } else if (level === 2) {
    currentQ = generateL2();
    renderInputQ(`If the input is <strong>${currentQ.inputVal}</strong>, what does this method return?`);
  } else {
    const challenges = level === 3 ? L3_CHALLENGES : L4_CHALLENGES;
    currentQ = { ...challenges[challengeIdx % challenges.length], type: "write" };
    challengeIdx++;
    renderWriteChallenge(currentQ);
  }
}

function renderInputQ(label) {
  const area = document.getElementById("questionArea");
  area.innerHTML = `
    <p class="q-label">${label}</p>
    <pre class="code" id="codeBlock"></pre>
    <input type="text" id="ansI" placeholder="type answer..."
           onkeypress="if(event.key==='Enter')check()">
    <button onclick="check()">Check</button>`;
  document.getElementById("codeBlock").textContent = currentQ.code;
  setTimeout(() => { const el = document.getElementById("ansI"); if (el) el.focus(); }, 50);
}

function renderWriteChallenge(challenge) {
  const area = document.getElementById("questionArea");
  const testsHtml = challenge.tests.map(([inp, out]) =>
    `(${challenge.param}=${inp}) → ${out}`
  ).join(',  ');
  area.innerHTML = `
    <p class="q-label">${challenge.desc}</p>
    <pre class="code" id="sigBlock"></pre>
    <textarea id="codeTA" rows="5" placeholder="write method body here..."
      style="display:block;width:90%;max-width:680px;margin:0 auto;border-radius:0;
             background:#f4f4f4;border:none;border-left:4px solid #3f51b5;
             padding:6px 14px;resize:vertical;font-family:monospace;font-size:13px;
             line-height:1.5;box-sizing:border-box;"></textarea>
    <pre class="code">}</pre>
    <p class="q-label">Test cases: ${testsHtml}</p>
    <button onclick="check()">Check</button>`;
  document.getElementById("sigBlock").textContent = challenge.sig + " {";
  setTimeout(() => { const el = document.getElementById("codeTA"); if (el) el.focus(); }, 50);
}

// ── helpers ───────────────────────────────────────────────────────────────────
function onCorrect() {
  score++;
  document.getElementById("score").innerText = score;
  document.getElementById("feedback").style.color = "#4caf50";
  document.getElementById("feedback").innerText = "Correct!";
  if (score >= passScore()) unlockNext();
  if (level === 1) {
    startCountdown();
  } else {
    document.getElementById("nextBtn").style.display = "inline-block";
  }
}

function onWrong(correctVal) {
  document.getElementById("feedback").style.color = "#f44336";
  document.getElementById("feedback").innerText = `Wrong! Answer: "${correctVal}"`;
  document.getElementById("nextBtn").style.display = "inline-block";
}

function unlockNext() {
  if (level < 4) {
    unlockedLevels[level] = true;
    const btn = document.getElementById("btn" + (level + 1));
    if (btn) { btn.classList.remove("locked"); btn.innerText = "Level " + (level + 1) + " — " + levelLabel(level + 1); }
    document.getElementById("feedback").innerText += "  Level " + (level + 1) + " unlocked!";
  } else {
    document.getElementById("feedback").innerText += "  You completed all levels!";
  }
}

function check() {
  if (answered) return;
  if (currentQ.type === "write") { checkWrite(); return; }
  answered = true;
  const val = document.getElementById("ansI").value.trim();
  if (!val) { answered = false; return; }
  if (val === String(currentQ.ans)) onCorrect();
  else onWrong(currentQ.ans);
}

function checkWrite() {
  const challenge = currentQ;
  const code = document.getElementById("codeTA").value.trim();
  if (!code) return;
  try {
    const fn = new Function(challenge.param, code);
    for (const [inp, expected] of challenge.tests) {
      const result = fn(inp);
      if (String(result) !== String(expected)) {
        document.getElementById("feedback").style.color = "#f44336";
        document.getElementById("feedback").innerText =
          `Test failed: (${challenge.param}=${inp}) → got ${result}, expected ${expected}`;
        return;
      }
    }
    answered = true;
    onCorrect();
  } catch(e) {
    document.getElementById("feedback").style.color = "#f44336";
    document.getElementById("feedback").innerText = `Error: ${e.message}`;
  }
}

// ── countdown (level 1 only) ──────────────────────────────────────────────────
function startCountdown() {
  const el = document.getElementById("countdown");
  const txt = document.getElementById("countdown-text");
  el.style.display = "block";
  const duration = 3000;
  const startTime = performance.now();
  function frame(now) {
    const remaining = Math.max(0, duration - (now - startTime));
    const pct = (remaining / duration) * 100;
    el.style.background = `conic-gradient(#3f51b5 ${pct}%, #e0e0e0 0%)`;
    txt.innerText = Math.ceil(remaining / 1000);
    if (remaining > 0) {
      countdownRaf = requestAnimationFrame(frame);
    } else {
      el.style.display = "none";
      nextQuestion();
    }
  }
  countdownRaf = requestAnimationFrame(frame);
}

function cancelCountdown() {
  if (countdownRaf) { cancelAnimationFrame(countdownRaf); countdownRaf = null; }
  document.getElementById("countdown").style.display = "none";
}

// ── level 1 generator ─────────────────────────────────────────────────────────
function generateL1() {
  const r = (m) => Math.floor(Math.random() * m);
  const start = r(8) + 2;
  const qType = r(8);
  let code, ans;
  if (qType === 0) {
    code = `int i = ${start};\ni++;\n// What is i?`;
    ans = start + 1;
  } else if (qType === 1) {
    code = `int i = ${start};\ni--;\n// What is i?`;
    ans = start - 1;
  } else if (qType === 2) {
    code = `int i = ${start};\ni++;\ni++;\ni++;\n// What is i?`;
    ans = start + 3;
  } else if (qType === 3) {
    const n = r(2) + 2;
    let lines = `int i = ${start + n};\n`;
    for (let k = 0; k < n; k++) lines += `i--;\n`;
    lines += `// What is i?`;
    code = lines; ans = start;
  } else if (qType === 4) {
    const step = r(5) + 1;
    code = `int i = ${start};\ni += ${step};\n// What is i?`;
    ans = start + step;
  } else if (qType === 5) {
    const step = r(start - 1) + 1;
    code = `int i = ${start};\ni -= ${step};\n// What is i?`;
    ans = start - step;
  } else if (qType === 6) {
    const inc = r(3) + 1, dec = r(3) + 1;
    let lines = `int i = ${start};\n`;
    for (let k = 0; k < inc; k++) lines += `i++;\n`;
    for (let k = 0; k < dec; k++) lines += `i--;\n`;
    lines += `// What is i?`;
    code = lines; ans = start + inc - dec;
  } else {
    const step = r(5) + 1;
    code = `int i = ${start};\ni = i + ${step};\n// What is i?`;
    ans = start + step;
  }
  return { type: "input", code, ans: String(ans) };
}

// ── level 2 generator ─────────────────────────────────────────────────────────
function generateL2() {
  const r = (m) => Math.floor(Math.random() * m);
  const inputVal = r(7) + 2; // 2–8
  const qType = r(10);
  let code, ans;

  if (qType === 0) {
    code = `int f(int n) {\n  return ++n;\n}`;
    ans = inputVal + 1;
  } else if (qType === 1) {
    code = `int f(int n) {\n  return n++;\n}`;
    ans = inputVal; // post-increment returns original
  } else if (qType === 2) {
    code = `int f(int n) {\n  return --n;\n}`;
    ans = inputVal - 1;
  } else if (qType === 3) {
    code = `int f(int n) {\n  return n--;\n}`;
    ans = inputVal; // post-decrement returns original
  } else if (qType === 4) {
    const times = r(3) + 2;
    let body = "";
    for (let i = 0; i < times; i++) body += `  n++;\n`;
    body += `  return n;`;
    code = `int f(int n) {\n${body}\n}`;
    ans = inputVal + times;
  } else if (qType === 5) {
    const times = r(2) + 2;
    let body = "";
    for (let i = 0; i < times; i++) body += `  n--;\n`;
    body += `  return n;`;
    code = `int f(int n) {\n${body}\n}`;
    ans = inputVal - times;
  } else if (qType === 6) {
    const k = r(5) + 2;
    code = `int f(int n) {\n  n += ${k};\n  return n;\n}`;
    ans = inputVal + k;
  } else if (qType === 7) {
    const k = r(Math.min(inputVal - 1, 4)) + 1;
    code = `int f(int n) {\n  n -= ${k};\n  return n;\n}`;
    ans = inputVal - k;
  } else if (qType === 8) {
    code = `int f(int n) {\n  ++n;\n  return n;\n}`;
    ans = inputVal + 1;
  } else {
    code = `int f(int n) {\n  n++;\n  n--;\n  return n;\n}`;
    ans = inputVal;
  }

  return { type: "input", code, inputVal, ans: String(ans) };
}

// ── level 3 challenges (write ++/-- method body) ───────────────────────────────
const L3_CHALLENGES = [
  {
    desc: 'Write a method body that increases n by 2 using ++ twice, then returns n.',
    sig: 'int addTwo(int n)',
    param: 'n',
    tests: [[0,2],[5,7],[10,12]],
  },
  {
    desc: 'Write a method body that decreases n by 3 using -- three times, then returns n.',
    sig: 'int subThree(int n)',
    param: 'n',
    tests: [[10,7],[5,2],[3,0]],
  },
  {
    desc: 'Write a method body that increases n by 5 using +=, then returns n.',
    sig: 'int addFive(int n)',
    param: 'n',
    tests: [[0,5],[3,8],[10,15]],
  },
  {
    desc: 'Write a method body that returns n + 1. Use only ++ (no + operator).',
    sig: 'int inc(int n)',
    param: 'n',
    tests: [[4,5],[0,1],[9,10]],
  },
  {
    desc: 'Write a method body that decreases n by 2 using -=, then returns n.',
    sig: 'int subTwo(int n)',
    param: 'n',
    tests: [[5,3],[10,8],[2,0]],
  },
  {
    desc: 'Write a method body that uses ++ once, then -= 1, then += 3. Return n.',
    sig: 'int addThree(int n)',
    param: 'n',
    tests: [[0,3],[5,8],[7,10]],
  },
  {
    desc: 'Write a method body that increments n with ++, then multiplies n by 2 using *=, then returns n.',
    sig: 'int incDouble(int n)',
    param: 'n',
    tests: [[2,6],[4,10],[0,2]],
  },
  {
    desc: 'Write a method body that doubles n using *=, then decrements n using --. Return n.',
    sig: 'int doubleDec(int n)',
    param: 'n',
    tests: [[3,5],[5,9],[1,1]],
  },
];

// ── level 4 challenges (write method with if + ++/--) ─────────────────────────
const L4_CHALLENGES = [
  {
    desc: 'Increment n using ++, but only if n is less than 10. Return n.',
    sig: 'int capAt10(int n)',
    param: 'n',
    tests: [[5,6],[9,10],[10,10],[0,1]],
  },
  {
    desc: 'Decrement n using --, but only if n is greater than 0. Return n.',
    sig: 'int floorAt0(int n)',
    param: 'n',
    tests: [[5,4],[1,0],[0,0],[3,2]],
  },
  {
    desc: 'If n is greater than 5, decrement n using --. Otherwise increment n using ++. Return n.',
    sig: 'int adjust(int n)',
    param: 'n',
    tests: [[7,6],[6,5],[5,6],[3,4],[0,1]],
  },
  {
    desc: 'If n is less than 5, increment n twice using ++. Otherwise decrement n once using --. Return n.',
    sig: 'int nudge(int n)',
    param: 'n',
    tests: [[3,5],[4,6],[5,4],[8,7],[0,2]],
  },
  {
    desc: 'Increment n using ++. Then if n is now greater than 8, decrement n twice using --. Return n.',
    sig: 'int limit(int n)',
    param: 'n',
    tests: [[5,6],[7,8],[8,7],[9,8],[3,4]],
  },
  {
    desc: 'If n equals 0, increment n three times using ++. Otherwise decrement n once using --. Return n.',
    sig: 'int zeroBoost(int n)',
    param: 'n',
    tests: [[0,3],[5,4],[1,0],[8,7]],
  },
  {
    desc: 'If n is between 3 and 7 (inclusive), increment n twice using ++. Otherwise increment n once. Return n.',
    sig: 'int rangeDouble(int n)',
    param: 'n',
    tests: [[3,5],[7,9],[2,3],[8,9],[5,7]],
  },
  {
    desc: 'If n is between 3 and 7 (inclusive), decrement n twice using --. Otherwise increment n once using ++. Return n.',
    sig: 'int rangeAdjust(int n)',
    param: 'n',
    tests: [[3,1],[5,3],[7,5],[2,3],[8,9],[0,1]],
  },
];

nextQuestion();
</script>
</body>
</html>
