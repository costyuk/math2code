<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>French Practice</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f4ff; margin: 0; padding: 10px; text-align: center; }
    .container { background: white; max-width: 680px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); min-height: 400px; }
    h1 { color: #1a237e; font-size: 22px; margin: 0 0 10px; }
    button { padding: 8px 18px; margin: 4px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .btn-primary   { background: #3f51b5; color: white; }
    .btn-secondary { background: #9e9e9e; color: white; }
    .btn-large     { font-size: 16px; padding: 11px 30px; }
    .btn-primary:hover   { background: #303f9f; }
    .btn-secondary:hover { background: #757575; }
    .btn-primary:focus, .btn-secondary:focus { outline: 2px solid #1a237e; outline-offset: 2px; }

    /* Lesson list */
    .lesson-card {
      background: #e8eaf6; border-radius: 10px; padding: 14px 18px;
      margin: 8px 0; cursor: pointer; text-align: left;
      display: flex; align-items: center; gap: 14px; transition: background 0.15s;
    }
    .lesson-card:hover { background: #c5cae9; }
    .lesson-flag { font-size: 30px; }
    .lesson-info .l-title    { font-weight: bold; font-size: 16px; color: #1a237e; }
    .lesson-info .l-subtitle { font-size: 13px; color: #666; }
    .lesson-info .l-count    { font-size: 12px; color: #888; margin-top: 2px; }

    /* Round badge */
    .round-badge {
      display: inline-block; background: #e8eaf6; color: #3f51b5;
      font-size: 12px; font-weight: bold; padding: 3px 12px;
      border-radius: 20px; margin-bottom: 10px; letter-spacing: 0.5px;
    }

    /* Word image */
    .word-img-wrap {
      width: 200px; height: 200px; position: relative;
      margin: 10px auto; border-radius: 16px; overflow: hidden;
      background: #e8eaf6;
    }
    .word-img-wrap .placeholder {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; font-size: 70px; font-weight: bold;
      color: #9fa8da; text-transform: uppercase;
    }
    .word-img-wrap img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover;
    }

    /* Word text */
    .word-fr { font-size: 34px; font-weight: bold; color: #1a237e; margin: 10px 0 4px; }
    .word-en { font-size: 18px; color: #555; margin: 4px 0 10px; }

    /* Pronounce button */
    .pronounce-btn {
      background: #e8eaf6; color: #3f51b5; border: 2px solid #c5cae9;
      border-radius: 50%; width: 44px; height: 44px; padding: 0;
      font-size: 20px; cursor: pointer; vertical-align: middle;
    }
    .pronounce-btn:hover { background: #c5cae9; }

    /* Navigation row */
    .nav-row { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 10px 0; }
    .nav-btn  { background: #e8eaf6; color: #3f51b5; font-size: 20px; padding: 6px 18px; border-radius: 8px; border: none; cursor: pointer; }
    .nav-btn:hover { background: #c5cae9; }
    .nav-btn:disabled { background: #f5f5f5; color: #bdbdbd; cursor: default; }
    .word-counter { font-size: 15px; color: #888; min-width: 50px; }

    /* Mic */
    .mic-btn {
      width: 76px; height: 76px; border-radius: 50%; border: none; cursor: pointer;
      background: #3f51b5; color: white; font-size: 30px; margin: 10px auto; display: block;
      transition: background 0.2s;
    }
    .mic-btn:hover:not(:disabled) { background: #303f9f; }
    .mic-btn.listening {
      background: #f44336;
      animation: mic-pulse 1s ease-in-out infinite;
    }
    .mic-btn:disabled { background: #bdbdbd; cursor: default; }
    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(244,67,54,0.5); }
      50%       { box-shadow: 0 0 0 16px rgba(244,67,54,0); }
    }
    .mic-status     { font-size: 13px; color: #888; min-height: 18px; margin: 2px 0; }
    .mic-transcript { font-size: 16px; color: #333; font-style: italic; min-height: 24px; margin: 4px 0; }

    /* Feedback & score */
    #feedback { font-size: 16px; font-weight: bold; min-height: 24px; margin: 6px 0; }
    .score-bar { font-size: 13px; color: #777; margin: 4px 0; }
    .next-btn { background: #3f51b5; color: white; font-size: 14px; padding: 9px 26px; border-radius: 8px; margin-top: 6px; }
    .next-btn:focus { outline: 2px solid #1a237e; outline-offset: 2px; }
    .continue-row { margin-top: 16px; border-top: 1px solid #eee; padding-top: 14px; }

    /* Result */
    #resultScreen { display: none; }
    .result-score { font-size: 44px; font-weight: bold; color: #1a237e; margin: 10px 0; }
    .result-stars { font-size: 36px; margin: 4px 0; }
  </style>
</head>
<body>
<div class="container">
  <h1>French Practice</h1>

  <!-- Lesson list -->
  <div id="lessonSelect">
    <div id="lessonList"></div>
  </div>

  <!-- Round screen (all 3 rounds) -->
  <div id="roundScreen" style="display:none">
    <div class="round-badge" id="roundBadge"></div>
    <div id="wordArea"></div>
    <div id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextSpeakWord()" style="display:none">Next &#8594;</button>
    <div class="score-bar" id="scoreBar" style="display:none">
      Score: <span id="score">0</span> / <span id="scorable">0</span>
    </div>
    <div class="continue-row" id="continueRow"></div>
  </div>

  <!-- Result screen -->
  <div id="resultScreen">
    <h2>Round 3 Complete!</h2>
    <div class="result-stars" id="resultStars"></div>
    <div class="result-score" id="resultScore"></div>
    <p id="resultMsg" style="color:#555;font-size:15px"></p>
    <button class="btn-primary btn-large" onclick="startRound(1)">Start Over</button>
    <button class="btn-secondary btn-large" onclick="showLessons()">All Lessons</button>
  </div>
</div>

<script>
// ── lesson registry ──────────────────────────────────────────────────────────
const FRENCH_LESSONS = [];

// ── state ────────────────────────────────────────────────────────────────────
let currentLesson = null;
let currentRound = 1;
let wordIdx = 0;
let score = 0;
let scorable = 0;
let answered = false;
let currentSpeakAnswer = null;

// ── speech synthesis ─────────────────────────────────────────────────────────
function pronounce(text) {
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = "fr-FR";
  utt.rate = 0.82;
  window.speechSynthesis.speak(utt);
}

// ── speech recognition ───────────────────────────────────────────────────────
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "fr-FR";
  recognition.interimResults = false;
  recognition.maxAlternatives = 5;
}

function normalizeText(s) {
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}

// ── screens ──────────────────────────────────────────────────────────────────
function showLessons() {
  window.speechSynthesis.cancel();
  hide("roundScreen"); hide("resultScreen");
  show("lessonSelect");
}

function openLesson(lesson) {
  currentLesson = lesson;
  startRound(1);
}

function startRound(n) {
  currentRound = n;
  wordIdx = 0;
  score = 0; scorable = 0; answered = false;
  hide("lessonSelect"); hide("resultScreen");

  document.getElementById("feedback").textContent = "";
  document.getElementById("nextBtn").style.display = "none";
  const sb = document.getElementById("scoreBar");

  if (n === 1) {
    document.getElementById("roundBadge").textContent = "Round 1 of 3 — Study";
    sb.style.display = "none";
  } else if (n === 2) {
    document.getElementById("roundBadge").textContent = "Round 2 of 3 — Recognize";
    sb.style.display = "none";
  } else {
    document.getElementById("roundBadge").textContent = "Round 3 of 3 — Speak";
    sb.style.display = "block";
    document.getElementById("score").textContent = 0;
    document.getElementById("scorable").textContent = currentLesson.words.length;
  }

  show("roundScreen");
  renderWord();
}

// ── word rendering ───────────────────────────────────────────────────────────
function renderWord() {
  answered = false;
  document.getElementById("feedback").textContent = "";
  document.getElementById("nextBtn").style.display = "none";

  const word = currentLesson.words[wordIdx];
  const area = document.getElementById("wordArea");
  const continueRow = document.getElementById("continueRow");

  // image block (shared by all rounds)
  const imgBlock = `
    <div class="word-img-wrap">
      <div class="placeholder">${word.fr.charAt(0)}</div>
      <img src="images/${word.image}" alt="${word.fr}" onerror="this.style.display='none'">
    </div>`;

  if (currentRound === 1) {
    // fr word + english + image + pronounce, navigate
    area.innerHTML = `
      ${imgBlock}
      <div style="display:flex;align-items:center;justify-content:center;gap:10px">
        <div class="word-fr">${word.fr}</div>
        <button class="pronounce-btn" onclick="pronounce('${word.fr.replace(/'/g,"\\'")}')">&#128264;</button>
      </div>
      <div class="word-en">${word.en}</div>
      ${navRowHTML()}`;
    pronounce(word.fr);
    updateContinue("Continue to Round 2 &#8594;", () => startRound(2));

  } else if (currentRound === 2) {
    // fr word + image, NO english, pronounce
    area.innerHTML = `
      ${imgBlock}
      <div style="display:flex;align-items:center;justify-content:center;gap:10px">
        <div class="word-fr">${word.fr}</div>
        <button class="pronounce-btn" onclick="pronounce('${word.fr.replace(/'/g,"\\'")}')">&#128264;</button>
      </div>
      ${navRowHTML()}`;
    pronounce(word.fr);
    updateContinue("Continue to Round 3 &#8594;", () => startRound(3));

  } else {
    // round 3: image only, student speaks
    scorable++;
    currentSpeakAnswer = word.fr;
    document.getElementById("scorable").textContent = currentLesson.words.length;

    const micHtml = recognition
      ? `<button class="mic-btn" id="micBtn" onclick="startListening()">&#127908;</button>
         <div class="mic-status" id="micStatus">Press mic and say the French word</div>
         <div class="mic-transcript" id="micTranscript"></div>`
      : `<p style="color:#e65100;font-size:13px">Speech recognition not supported.<br>Try Chrome or Edge.</p>`;

    area.innerHTML = `${imgBlock}${micHtml}`;
    continueRow.innerHTML = "";
  }
}

function navRowHTML() {
  const total = currentLesson.words.length;
  const prevDis = wordIdx === 0 ? "disabled" : "";
  const nextDis = wordIdx === total - 1 ? "disabled" : "";
  return `
    <div class="nav-row">
      <button class="nav-btn" ${prevDis} onclick="navigate(-1)">&#8592;</button>
      <span class="word-counter">${wordIdx + 1} / ${total}</span>
      <button class="nav-btn" ${nextDis} onclick="navigate(1)">&#8594;</button>
    </div>`;
}

function updateContinue(label, action) {
  const row = document.getElementById("continueRow");
  const btn = document.createElement("button");
  btn.className = "btn-primary btn-large";
  btn.innerHTML = label;
  btn.onclick = action;
  row.innerHTML = "";
  row.appendChild(btn);
  row.appendChild(document.createElement("br"));
  const back = document.createElement("button");
  back.className = "btn-secondary";
  back.style.marginTop = "6px";
  back.textContent = "Back to Lessons";
  back.onclick = showLessons;
  row.appendChild(back);
}

function navigate(delta) {
  const total = currentLesson.words.length;
  wordIdx = Math.max(0, Math.min(total - 1, wordIdx + delta));
  renderWord();
}

// ── round 3: speak ───────────────────────────────────────────────────────────
function startListening() {
  if (!recognition || answered) return;
  const micBtn = document.getElementById("micBtn");
  const micStatus = document.getElementById("micStatus");
  const micTranscript = document.getElementById("micTranscript");

  micBtn.classList.add("listening");
  micBtn.disabled = true;
  micStatus.textContent = "Listening...";
  micTranscript.textContent = "";
  document.getElementById("feedback").textContent = "";

  recognition.onresult = (e) => {
    const alts = Array.from(e.results[0]).map(r => r.transcript.trim());
    micTranscript.textContent = "\u201c" + alts[0] + "\u201d";
    checkSpeak(alts);
  };

  recognition.onerror = (e) => {
    micBtn.classList.remove("listening");
    micBtn.disabled = false;
    const msgs = { "no-speech": "No speech detected. Try again.", "not-allowed": "Microphone access denied." };
    micStatus.textContent = msgs[e.error] || "Error: " + e.error + ". Try again.";
    if (e.error === "not-allowed") micBtn.disabled = true;
  };

  recognition.onend = () => {
    micBtn.classList.remove("listening");
    if (!answered) micBtn.disabled = false;
  };

  recognition.start();
}

function checkSpeak(alts) {
  if (answered) return;
  answered = true;
  const micBtn = document.getElementById("micBtn");
  if (micBtn) micBtn.disabled = true;
  const micStatus = document.getElementById("micStatus");
  if (micStatus) micStatus.textContent = "";

  const expected = currentSpeakAnswer;
  const normExp = normalizeText(expected);
  const isCorrect = alts.some(a => normalizeText(a) === normExp || a.toLowerCase().trim() === expected.toLowerCase().trim());

  const fb = document.getElementById("feedback");
  if (isCorrect) {
    score++;
    document.getElementById("score").textContent = score;
    fb.style.color = "#4caf50"; fb.textContent = "Correct!";
  } else {
    fb.style.color = "#f44336"; fb.textContent = `Wrong! Expected: "${expected}"`;
  }

  const nb = document.getElementById("nextBtn");
  nb.style.display = "inline-block"; nb.focus();
}

function nextSpeakWord() {
  wordIdx++;
  if (wordIdx >= currentLesson.words.length) {
    showResult();
    return;
  }
  renderWord();
}

// ── result ───────────────────────────────────────────────────────────────────
function showResult() {
  window.speechSynthesis.cancel();
  hide("roundScreen");
  const pct = currentLesson.words.length > 0 ? Math.round((score / currentLesson.words.length) * 100) : 0;
  document.getElementById("resultScore").textContent = `${score} / ${currentLesson.words.length}`;
  let stars = "★★★", msg = "Excellent! Perfect pronunciation!";
  if (pct < 80) { stars = "★★☆"; msg = "Good effort! Keep practicing your pronunciation."; }
  if (pct < 50) { stars = "★☆☆"; msg = "Keep going! Say each word clearly and try again."; }
  document.getElementById("resultStars").textContent = stars;
  document.getElementById("resultMsg").textContent = msg;
  show("resultScreen");
}

// ── helpers ──────────────────────────────────────────────────────────────────
function show(id) { document.getElementById(id).style.display = "block"; }
function hide(id) { document.getElementById(id).style.display = "none"; }

// ── lesson list renderer ─────────────────────────────────────────────────────
function renderLessonList() {
  const list = document.getElementById("lessonList");
  if (FRENCH_LESSONS.length === 0) {
    list.innerHTML = "<p style='color:#999'>No lessons loaded.</p>";
    return;
  }
  list.innerHTML = FRENCH_LESSONS.map((l, i) => `
    <div class="lesson-card" onclick="openLesson(FRENCH_LESSONS[${i}])">
      <div class="lesson-flag">&#127467;&#127479;</div>
      <div class="lesson-info">
        <div class="l-title">Lesson ${l.id}: ${l.titleEn}</div>
        <div class="l-subtitle">${l.title}</div>
        <div class="l-count">${l.words.length} words &bull; 3 rounds</div>
      </div>
    </div>`).join("");
}

window.addEventListener("DOMContentLoaded", renderLessonList);
</script>

<!-- Add more lessons: <script src="lessons/lesson2.js"></script> -->
<script src="lessons/lesson1.js"></script>

</body>
</html>
