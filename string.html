<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>String Methods Practice</title>
  <style>
    body { font-family: Arial; background: #eef2ff; text-align: center; margin: 0; padding: 6px; }
    .container { background: white; max-width: 860px; margin: auto; padding: 16px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2 { color: #333; font-size: 18px; margin: 6px 0; }
    h3 { font-size: 15px; margin: 6px 0; }
    button { padding: 7px 14px; margin: 4px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .levelBtn { background: #3f51b5; color: white; }
    .locked    { background: #bdbdbd; color: #444; }
    pre.code {
      background: #f4f4f4; padding: 10px 14px; border-radius: 8px;
      font-family: monospace; font-size: 13px; line-height: 1.5;
      text-align: left; display: block; margin: 8px auto;
      max-width: 680px; overflow-x: auto; white-space: pre;
      border-left: 4px solid #3f51b5;
    }
    .q-label { font-size: 16px; color: #333; margin-bottom: 8px; }
    input[type="text"] {
      padding: 7px 10px; font-size: 14px; width: 200px;
      border: 2px solid #ccc; border-radius: 8px; margin: 6px;
      font-family: monospace;
    }
    input[type="text"]:focus { outline: none; border-color: #3f51b5; }
    #feedback { font-size: 15px; font-weight: bold; margin: 6px 0; min-height: 22px; }
    .score-bar { font-size: 13px; color: #555; margin: 5px 0; }
    .next-btn { background: #3f51b5; color: white; font-size: 13px; padding: 7px 22px; border-radius: 8px; margin-top: 6px; }
    .back-btn { background: #9e9e9e; color: white; }
    .tf-btn { font-size: 16px; padding: 10px 30px; border-radius: 8px; font-weight: bold; }
    .tf-true  { background: #4caf50; color: white; }
    .tf-false { background: #f44336; color: white; }
    .tf-true:hover  { background: #388e3c; }
    .tf-false:hover { background: #c62828; }
    #pinPanel { display: none; margin-top: 12px; background: #fff3cd; padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>
<div class="container">

  <h2>String Methods Practice</h2>

  <div id="levelSelect">
    <h3>Select Level</h3>
    <button class="levelBtn" onclick="selectLevel(1)">Level 1 &mdash; .length() / .isEmpty() / .isBlank()</button><br>
    <button class="levelBtn locked" id="btn2" onclick="selectLevel(2)">Level 2 &mdash; .charAt() / .indexOf() / .lastIndexOf()</button><br>
    <button class="levelBtn locked" id="btn3" onclick="selectLevel(3)">Level 3 &mdash; Write: 1-Line</button><br>
    <button class="levelBtn locked" id="btn4" onclick="selectLevel(4)">Level 4 &mdash; Write: 2-Line</button><br>
    <button class="levelBtn locked" id="btn5" onclick="selectLevel(5)">Level 5 &mdash; Write: Multi-Line</button><br>
    <button class="levelBtn locked" id="btn6" onclick="selectLevel(6)">Level 6 &mdash; Write: Full Method</button><br>
    <button class="levelBtn locked" id="btn7" onclick="selectLevel(7)">Level 7 &mdash; Write: Full Method + If/Else</button><br>
    <p style="color:#888;font-size:14px">Pass levels 1/2/3 with 30/25/15, levels 4/5/6/7 with 12/10/8/8. Or ask your teacher for the PIN.</p>
    <div id="pinPanel">
      <p>Enter Teacher PIN to unlock:</p>
      <input id="pinInput" type="password" placeholder="PIN"
             onkeypress="if(event.key==='Enter')checkPin()" style="font-size:17px;width:100px;padding:8px;border-radius:6px;border:1px solid #ccc">
      <button onclick="checkPin()">Unlock</button>
    </div>
    <br>
    <a href="index.html"><button class="back-btn">&#8592; Main Menu</button></a>
  </div>

  <div id="quiz" style="display:none">
    <h3 id="levelTitle"></h3>
    <div id="questionArea"></div>
    <div id="feedback"></div>
    <div class="score-bar">Correct: <span id="score">0</span> / <span id="passScore">30</span></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()" style="display:none">Next &#8594;</button>
    <br>
    <button class="back-btn" onclick="goBack()">&#8592; Back</button>
  </div>

</div>

<script>
let level = 1;
let score = 0;
let answered = false;
let requestedLevel = null;
let unlockedLevels = [true, false, false, false, false, false, false];
let challengeIdx = 0;
let currentQ = null;

function selectLevel(l) {
  if (!unlockedLevels[l - 1]) {
    requestedLevel = l;
    document.getElementById("pinPanel").style.display = "block";
    return;
  }
  startQuiz(l);
}

function checkPin() {
  const pin = document.getElementById("pinInput").value;
  document.getElementById("pinInput").value = "";
  if (pin === "1502") {
    unlockedLevels[requestedLevel - 1] = true;
    const btn = document.getElementById("btn" + requestedLevel);
    if (btn) { btn.classList.remove("locked"); }
    document.getElementById("pinPanel").style.display = "none";
    startQuiz(requestedLevel);
  } else {
    alert("Wrong PIN");
  }
}

function levelLabel(l) {
  return [".length() / .isEmpty() / .isBlank()", ".charAt() / .indexOf() / .lastIndexOf()", "Write: 1-Line", "Write: 2-Line", "Write: Multi-Line", "Write: Full Method", "Write: Full Method + If/Else"][l - 1] || "";
}

function passScore() {
  if (level === 1) return 30;
  if (level === 2) return 25;
  if (level === 3) return 15;
  if (level === 4) return 12;
  if (level === 5) return 10;
  return 8; // levels 6 and 7
}

function startQuiz(l) {
  level = l;
  score = 0;
  challengeIdx = 0;
  document.getElementById("score").innerText = 0;
  document.getElementById("passScore").innerText = passScore();
  document.getElementById("quiz").style.display = "block";
  document.getElementById("levelSelect").style.display = "none";
  document.getElementById("levelTitle").innerText = "Level " + l + " \u2014 " + levelLabel(l);
  nextQuestion();
}

function goBack() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("levelSelect").style.display = "block";
}

function nextQuestion() {
  answered = false;
  document.getElementById("feedback").innerText = "";
  document.getElementById("nextBtn").style.display = "none";

  if (level === 1) {
    currentQ = generateL1();
  } else if (level === 2) {
    currentQ = generateL2();
  } else if (level >= 3) {
    const challenges = level === 3 ? L3_CHALLENGES : level === 4 ? L4_CHALLENGES : level === 5 ? L5_CHALLENGES : level === 6 ? L6_CHALLENGES : L7_CHALLENGES;
    currentQ = { ...challenges[challengeIdx % challenges.length], type: "write" };
    challengeIdx++;
    if (level >= 6) {
      renderFullMethodChallenge(currentQ);
    } else {
      renderWriteChallenge(currentQ);
    }
    return;
  }

  if (currentQ.type === "tf") {
    renderTF();
  } else {
    renderInputQ("What does this return?");
  }
}

function renderInputQ(label) {
  const area = document.getElementById("questionArea");
  area.innerHTML = `
    <p class="q-label">${label}</p>
    <pre class="code" id="codeBlock"></pre>
    <input type="text" id="ansI" placeholder="type answer..."
           onkeypress="if(event.key==='Enter')check()">
    <button onclick="check()">Check</button>`;
  document.getElementById("codeBlock").textContent = currentQ.code;
  setTimeout(() => { const el = document.getElementById("ansI"); if (el) el.focus(); }, 50);
}

function renderTF() {
  const area = document.getElementById("questionArea");
  area.innerHTML = `
    <p class="q-label">True or False?</p>
    <pre class="code" id="codeBlock"></pre>
    <button class="tf-btn tf-true" onclick="checkTF(true)">True</button>
    <button class="tf-btn tf-false" onclick="checkTF(false)">False</button>`;
  document.getElementById("codeBlock").textContent = currentQ.code;
}

function onCorrect() {
  score++;
  document.getElementById("score").innerText = score;
  document.getElementById("feedback").style.color = "#4caf50";
  document.getElementById("feedback").innerText = "Correct!";
  if (score >= passScore()) unlockNext();
  const nb = document.getElementById("nextBtn"); nb.style.display = "inline-block"; nb.focus();
}

function onWrong(correctVal) {
  document.getElementById("feedback").style.color = "#f44336";
  document.getElementById("feedback").innerText = `Wrong! Answer: "${correctVal}"`;
  const nb = document.getElementById("nextBtn"); nb.style.display = "inline-block"; nb.focus();
}

function unlockNext() {
  if (level < 7) {
    unlockedLevels[level] = true;
    const btn = document.getElementById("btn" + (level + 1));
    if (btn) { btn.classList.remove("locked"); }
    document.getElementById("feedback").innerText += "  Level " + (level + 1) + " unlocked!";
  } else {
    document.getElementById("feedback").innerText += "  You completed all levels!";
  }
}

function check() {
  if (answered) return;
  if (currentQ.type === "write") { checkWrite(); return; }
  answered = true;
  const val = document.getElementById("ansI").value.trim();
  if (!val) { answered = false; return; }
  if (val === String(currentQ.ans)) onCorrect();
  else onWrong(currentQ.ans);
}

function renderWriteChallenge(challenge) {
  const area = document.getElementById("questionArea");
  const testsHtml = challenge.tests.map(test => {
    return `("${test[0]}") &rarr; ${JSON.stringify(test[1])}`;
  }).join(',  ');
  const useTextarea = level >= 4;
  const inputHtml = useTextarea
    ? `<textarea id="codeTA" rows="${level === 4 ? 3 : 5}" placeholder="write method body here..."
        style="display:block;width:90%;max-width:680px;margin:0 auto;border-radius:0;
               background:#f4f4f4;border:none;border-left:4px solid #3f51b5;
               padding:6px 14px;resize:vertical;font-family:monospace;font-size:13px;
               line-height:1.5;box-sizing:border-box;"></textarea>`
    : `<input type="text" id="codeInput" placeholder="return ...;"
             style="width:90%;max-width:680px;font-family:monospace;font-size:13px;padding:7px 10px;"
             onkeypress="if(event.key==='Enter')check()">`;
  area.innerHTML = `
    <p class="q-label">${challenge.desc}</p>
    <pre class="code" id="sigBlock"></pre>
    ${inputHtml}
    <pre class="code">}</pre>
    <p class="q-label">Test cases: ${testsHtml}</p>
    <button onclick="check()">Check</button>`;
  document.getElementById("sigBlock").textContent = challenge.sig + " {";
  const focusId = useTextarea ? "codeTA" : "codeInput";
  setTimeout(() => { const el = document.getElementById(focusId); if (el) el.focus(); }, 50);
}

function renderFullMethodChallenge(challenge) {
  const area = document.getElementById("questionArea");
  const testsHtml = challenge.tests.map(test => {
    return `("${test[0]}") &rarr; ${JSON.stringify(test[1])}`;
  }).join(',  ');
  area.innerHTML = `
    <p class="q-label">${challenge.desc}</p>
    <p class="q-label" style="color:#999;font-size:12px">Write the complete method: signature + body + closing brace</p>
    <textarea id="codeTA" rows="6" placeholder="String myMethod(String s) {\n  ...\n  return ...;\n}"
      style="display:block;width:90%;max-width:680px;margin:0 auto;border-radius:0;
             background:#f4f4f4;border:none;border-left:4px solid #3f51b5;
             padding:6px 14px;resize:vertical;font-family:monospace;font-size:13px;
             line-height:1.5;box-sizing:border-box;"></textarea>
    <p class="q-label">Test cases: ${testsHtml}</p>
    <button onclick="check()">Check</button>`;
  setTimeout(() => { const el = document.getElementById("codeTA"); if (el) el.focus(); }, 50);
}

function checkWrite() {
  const challenge = currentQ;
  const el = document.getElementById("codeInput") || document.getElementById("codeTA");
  let code = el.value.trim();
  if (!code) return;

  if (level >= 6) {
    // Extract body from full method: remove signature line and closing brace
    const sigMatch = code.match(/^\s*\w+\s+\w+\s*\(\s*\w+\s+(\w+)\s*\)\s*\{/);
    if (!sigMatch) {
      document.getElementById("feedback").style.color = "#f44336";
      document.getElementById("feedback").innerText = 'Could not parse method signature. Expected format: ReturnType methodName(String paramName) { ... }';
      return;
    }
    const paramName = sigMatch[1];
    // Remove signature and closing brace
    code = code.replace(/^\s*\w+\s+\w+\s*\([^)]*\)\s*\{/, '').replace(/\}\s*$/, '').trim();
    try {
      const fn = new Function(paramName, code);
      for (const test of challenge.tests) {
        const result = fn(test[0]);
        if (String(result) !== String(test[1])) {
          document.getElementById("feedback").style.color = "#f44336";
          document.getElementById("feedback").innerText =
            `Test failed: ("${test[0]}") \u2192 got "${result}", expected "${test[1]}"`;
          return;
        }
      }
      answered = true;
      onCorrect();
    } catch(e) {
      document.getElementById("feedback").style.color = "#f44336";
      document.getElementById("feedback").innerText = `Error: ${e.message}`;
    }
    return;
  }

  try {
    const fn = new Function('s', code);
    for (const test of challenge.tests) {
      const result = fn(test[0]);
      if (String(result) !== String(test[1])) {
        document.getElementById("feedback").style.color = "#f44336";
        document.getElementById("feedback").innerText =
          `Test failed: ("${test[0]}") \u2192 got "${result}", expected "${test[1]}"`;
        return;
      }
    }
    answered = true;
    onCorrect();
  } catch(e) {
    document.getElementById("feedback").style.color = "#f44336";
    document.getElementById("feedback").innerText = `Error: ${e.message}`;
  }
}

function checkTF(userAns) {
  if (answered) return;
  answered = true;
  if (userAns === currentQ.ans) onCorrect();
  else onWrong(currentQ.ans);
}

// ── level 1 generator: .length(), .isEmpty(), .isBlank() ─────────────────────
function generateL1() {
  const r = (m) => Math.floor(Math.random() * m);

  const words = ["hello", "java", "cat", "dog", "pizza", "sun", "apple", "code", "test", "book",
                 "hi", "a", "ab", "xyz", "open", "red", "blue", "green", "fish", "moon"];
  const blanks = ["", " ", "  ", "   "];

  const qType = r(10);
  let code, ans;

  if (qType === 0) {
    // .length() on a normal string
    const w = words[r(words.length)];
    code = `String s = "${w}";\nint result = s.length();\n// What is result?`;
    ans = String(w.length);
    return { type: "input", code, ans };
  } else if (qType === 1) {
    // .length() on empty string
    code = `String s = "";\nint result = s.length();\n// What is result?`;
    ans = "0";
    return { type: "input", code, ans };
  } else if (qType === 2) {
    // .length() on string with spaces
    const sp = blanks[r(blanks.length - 1) + 1]; // at least 1 space
    code = `String s = "${sp}";\nint result = s.length();\n// What is result?`;
    ans = String(sp.length);
    return { type: "input", code, ans };
  } else if (qType === 3) {
    // .isEmpty() on empty string → true
    code = `String s = "";\nboolean result = s.isEmpty();\n// What is result?`;
    ans = true;
    return { type: "tf", code, ans };
  } else if (qType === 4) {
    // .isEmpty() on non-empty string → false
    const w = words[r(words.length)];
    code = `String s = "${w}";\nboolean result = s.isEmpty();\n// What is result?`;
    ans = false;
    return { type: "tf", code, ans };
  } else if (qType === 5) {
    // .isEmpty() on spaces → false (spaces are not empty)
    const sp = blanks[r(blanks.length - 1) + 1];
    code = `String s = "${sp}";\nboolean result = s.isEmpty();\n// What is result?`;
    ans = false;
    return { type: "tf", code, ans };
  } else if (qType === 6) {
    // .isBlank() on empty string → true
    code = `String s = "";\nboolean result = s.isBlank();\n// What is result?`;
    ans = true;
    return { type: "tf", code, ans };
  } else if (qType === 7) {
    // .isBlank() on spaces → true
    const sp = blanks[r(blanks.length - 1) + 1];
    code = `String s = "${sp}";\nboolean result = s.isBlank();\n// What is result?`;
    ans = true;
    return { type: "tf", code, ans };
  } else if (qType === 8) {
    // .isBlank() on non-empty string → false
    const w = words[r(words.length)];
    code = `String s = "${w}";\nboolean result = s.isBlank();\n// What is result?`;
    ans = false;
    return { type: "tf", code, ans };
  } else {
    // .length() on concatenated string
    const w1 = words[r(words.length)];
    const w2 = words[r(words.length)];
    code = `String s = "${w1}" + "${w2}";\nint result = s.length();\n// What is result?`;
    ans = String(w1.length + w2.length);
    return { type: "input", code, ans };
  }
}

// ── level 2 generator: .charAt(), .indexOf(), .lastIndexOf() ─────────────────
function generateL2() {
  const r = (m) => Math.floor(Math.random() * m);

  const words = ["banana", "apple", "tomato", "pepper", "cookie", "coffee", "butter", "mango",
                 "bottle", "little", "hello", "java", "letter", "pizza", "rabbit", "soccer"];

  const qType = r(12);
  const w = words[r(words.length)];
  let code, ans;

  if (qType === 0) {
    // .charAt(i) — random valid index
    const i = r(w.length);
    code = `String s = "${w}";\nchar result = s.charAt(${i});\n// What is result?`;
    ans = w.charAt(i);
    return { type: "input", code, ans };
  } else if (qType === 1) {
    // .charAt(0) — first char
    code = `String s = "${w}";\nchar result = s.charAt(0);\n// What is result?`;
    ans = w.charAt(0);
    return { type: "input", code, ans };
  } else if (qType === 2) {
    // .charAt(s.length() - 1) — last char
    code = `String s = "${w}";\nchar result = s.charAt(s.length() - 1);\n// What is result?`;
    ans = w.charAt(w.length - 1);
    return { type: "input", code, ans };
  } else if (qType === 3) {
    // .indexOf(char) — char exists
    const i = r(w.length);
    const ch = w.charAt(i);
    code = `String s = "${w}";\nint result = s.indexOf('${ch}');\n// What is result?`;
    ans = String(w.indexOf(ch));
    return { type: "input", code, ans };
  } else if (qType === 4) {
    // .indexOf(char) — char does NOT exist
    const missing = "zxqw".charAt(r(4));
    code = `String s = "${w}";\nint result = s.indexOf('${missing}');\n// What is result?`;
    ans = String(w.indexOf(missing));
    return { type: "input", code, ans };
  } else if (qType === 5) {
    // .lastIndexOf(char) — char that appears more than once
    const charCounts = {};
    for (const ch of w) charCounts[ch] = (charCounts[ch] || 0) + 1;
    let ch = null;
    for (const c in charCounts) { if (charCounts[c] > 1) { ch = c; break; } }
    if (!ch) ch = w.charAt(0); // fallback
    code = `String s = "${w}";\nint result = s.lastIndexOf('${ch}');\n// What is result?`;
    ans = String(w.lastIndexOf(ch));
    return { type: "input", code, ans };
  } else if (qType === 6) {
    // .lastIndexOf(char) — char that appears once
    const charCounts = {};
    for (const ch of w) charCounts[ch] = (charCounts[ch] || 0) + 1;
    let ch = null;
    for (const c in charCounts) { if (charCounts[c] === 1) { ch = c; break; } }
    if (!ch) ch = w.charAt(0);
    code = `String s = "${w}";\nint result = s.lastIndexOf('${ch}');\n// What is result?`;
    ans = String(w.lastIndexOf(ch));
    return { type: "input", code, ans };
  } else if (qType === 7) {
    // .indexOf(substring)
    const start = r(w.length - 2);
    const sub = w.substring(start, start + 2);
    code = `String s = "${w}";\nint result = s.indexOf("${sub}");\n// What is result?`;
    ans = String(w.indexOf(sub));
    return { type: "input", code, ans };
  } else if (qType === 8) {
    // .lastIndexOf(substring)
    const start = r(w.length - 2);
    const sub = w.substring(start, start + 2);
    code = `String s = "${w}";\nint result = s.lastIndexOf("${sub}");\n// What is result?`;
    ans = String(w.lastIndexOf(sub));
    return { type: "input", code, ans };
  } else if (qType === 9) {
    // .contains(substring) — true
    const start = r(w.length - 2);
    const sub = w.substring(start, start + 2);
    code = `String s = "${w}";\nboolean result = s.contains("${sub}");\n// What is result?`;
    ans = true;
    return { type: "tf", code, ans };
  } else if (qType === 10) {
    // .contains(substring) — false
    const fakeSubs = ["zx", "qw", "xk", "jz", "vq"];
    const sub = fakeSubs[r(fakeSubs.length)];
    code = `String s = "${w}";\nboolean result = s.contains("${sub}");\n// What is result?`;
    ans = false;
    return { type: "tf", code, ans };
  } else {
    // .contains(single char as string) — true
    const ch = w.charAt(r(w.length));
    code = `String s = "${w}";\nboolean result = s.contains("${ch}");\n// What is result?`;
    ans = true;
    return { type: "tf", code, ans };
  }
}

// ── level 3 challenges: write single-line solutions using string methods ──────
const L3_CHALLENGES = [
  {
    desc: 'Return the length of string s.',
    sig: 'int getLength(String s)',
    tests: [["hello", 5], ["java", 4], ["a", 1], ["", 0]],
  },
  {
    desc: 'Return the first character of string s.',
    sig: 'char firstChar(String s)',
    tests: [["hello", "h"], ["java", "j"], ["apple", "a"], ["zoo", "z"]],
  },
  {
    desc: 'Return the last character of string s.',
    sig: 'char lastChar(String s)',
    tests: [["hello", "o"], ["java", "a"], ["dog", "g"], ["quiz", "z"]],
  },
  {
    desc: 'Return true if the string s is empty, false otherwise.',
    sig: 'boolean checkEmpty(String s)',
    tests: [["", true], ["hello", false], [" ", false]],
  },
  {
    desc: 'Return true if the string s is blank (empty or only spaces), false otherwise.',
    sig: 'boolean checkBlank(String s)',
    tests: [["", true], [" ", true], ["  ", true], ["hi", false]],
  },
  {
    desc: 'Return the index of the first occurrence of the character "a" in s. Return -1 if not found.',
    sig: 'int findA(String s)',
    tests: [["banana", 1], ["apple", 0], ["hello", -1], ["java", 1]],
  },
  {
    desc: 'Return the index of the last occurrence of the character "a" in s.',
    sig: 'int lastA(String s)',
    tests: [["banana", 5], ["apple", 0], ["java", 3], ["abracadabra", 10]],
  },
  {
    desc: 'Return the character at index 2 of string s.',
    sig: 'char thirdChar(String s)',
    tests: [["hello", "l"], ["java", "v"], ["apple", "p"], ["cookie", "o"]],
  },
  {
    desc: 'Return the index of the first occurrence of "ll" in s. Return -1 if not found.',
    sig: 'int findLL(String s)',
    tests: [["hello", 2], ["yellow", 2], ["ball", 2], ["java", -1]],
  },
  {
    desc: 'Return true if the length of s is greater than 5, false otherwise.',
    sig: 'boolean isLong(String s)',
    tests: [["hello", false], ["banana", true], ["hi", false], ["cookie", true]],
  },
  {
